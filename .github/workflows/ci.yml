name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}

      - name: Rustfmt Check
        working-directory: ./app/src/main/rust
        run: cargo fmt --all -- --check

      - name: Clippy Check
        working-directory: ./app/src/main/rust
        run: cargo clippy --target aarch64-linux-android --all-features -- -D warnings

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check build-logic
        run: ./gradlew :build-logic:convention:check

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: Lint Check
        run: ./gradlew lintMarshmallowRelease

  default:
    runs-on: ubuntu-latest
    # Required so the "Publish APK to release" step can create/update the release.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-default-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-default-

      - name: Build
        run: ./gradlew assembleDefaultRelease

      # Replaced the three per-ABI uploads with a single arm64-v8a artifact:
      # that is the only ABI needed for a personal side-by-side build, and the
      # universal APK is large enough to be slow to build and download.
      - name: Upload ARM64
        uses: actions/upload-artifact@v7
        with:
          name: default-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v7
        with:
          name: default-universal-${{ github.sha }}
          path: app/build/outputs/apk/default/release/app-default-universal-release.apk

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: default-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/defaultRelease/*.txt

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: default-native-debug-symbols-${{ github.sha }}
          path: app/build/outputs/native-debug-symbols/defaultRelease/native-debug-symbols.zip

      # Publish the arm64 APK as a release asset as well. Actions artifacts
      # cannot be fetched through mirrors (they 302 to
      # pipelines.actions.githubusercontent.com with auth), while release assets
      # can. The tag is fixed so each push refreshes the same release.
      - name: Publish APK to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: zqy-cookie-login
          name: "EhViewer-zqy (cookie login, arm64-v8a)"
          body: |
            Side-by-side build of the EhViewer fork with cookie sign-in mode.
            Package name: moe.tarsin.ehviewer.zqy (installs alongside the original EhViewer).
            Built from commit ${{ github.sha }}.
          files: |
            app/build/outputs/apk/default/release/app-default-arm64-v8a-release.apk
          fail_on_unmatched_files: true

  marshmallow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Install Rust Toolchain
        run: rustup target add thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"
          shared-key: ${{ runner.os }}
          save-if: "false"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}

      - name: CMake Cache
        uses: actions/cache@v5
        with:
          path: app/.cxx
          key: cmake-marshmallow-${{ hashFiles('rust-toolchain.toml', 'settings.gradle.kts', 'app/src/main/cpp/CMakeLists.txt', 'app/src/main/rust/Cargo.lock') }}
          restore-keys: cmake-marshmallow-

      - name: Build
        run: ./gradlew assembleMarshmallowRelease

      - name: Upload ARM64
        uses: actions/upload-artifact@v7
        with:
          name: marshmallow-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/marshmallow/release/app-marshmallow-arm64-v8a-release.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          name: marshmallow-x86_64-${{ github.sha }}
          path: app/build/outputs/apk/marshmallow/release/app-marshmallow-x86_64-release.apk

      - name: Upload ARM32
        uses: actions/upload-artifact@v7
        with:
          name: marshmallow-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/marshmallow/release/app-marshmallow-armeabi-v7a-release.apk

      - name: Upload mapping
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marshmallow-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/marshmallowRelease/*.txt

      - name: Upload native debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: marshmallow-native-debug-symbols-${{ github.sha }}
          path: app/build/outputs/native-debug-symbols/marshmallowRelease/native-debug-symbols.zip
